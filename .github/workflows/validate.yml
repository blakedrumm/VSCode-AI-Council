name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Parse the script
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          $path = (Resolve-Path './Install-VSCodeCopilotCouncil-v5.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null

          if ($parseErrors)
          {
              foreach ($parseError in $parseErrors)
              {
                  Write-Host "::error file=Install-VSCodeCopilotCouncil-v5.ps1,line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
              }

              exit 1
          }

          Write-Host 'Parsed with no syntax errors.'

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -AllowClobber -ErrorAction Stop
          $findings = Invoke-ScriptAnalyzer -Path './Install-VSCodeCopilotCouncil-v5.ps1' -Settings './PSScriptAnalyzerSettings.psd1' -Severity Error, Warning
          $findings += Invoke-ScriptAnalyzer -Path './.github/scripts' -Recurse -Settings './PSScriptAnalyzerSettings.psd1' -Severity Error, Warning
          $findings += Invoke-ScriptAnalyzer -Path './tests' -Recurse -Settings './PSScriptAnalyzerSettings.psd1' -Severity Error, Warning

          if ($findings)
          {
              foreach ($finding in $findings)
              {
                  $relativePath = Resolve-Path -LiteralPath $finding.ScriptPath -Relative
                  Write-Host "::error file=$($relativePath -replace '^\.[\\/]', '' -replace '\\', '/'),line=$($finding.Line)::$($finding.RuleName) - $($finding.Message)"
              }

              exit 1
          }

          Write-Host 'PSScriptAnalyzer reported no errors or warnings.'

      - name: Run Pester on PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 6.0.1 -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 6.0.1 -Force
          Invoke-Pester -Path './tests' -CI -Output Detailed

      - name: Run Pester on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -RequiredVersion 6.0.1 -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 6.0.1 -Force
          Invoke-Pester -Path './tests' -CI -Output Detailed

      - name: Confirm the version constant matches the help header
        shell: pwsh
        run: |
          # The update check reads the constant, so a stale .NOTES entry would mislead anyone
          # reading the file rather than running it.
          $text = Get-Content './Install-VSCodeCopilotCouncil-v5.ps1' -Raw
          $constant = [regex]::Match($text, '\$ScriptVersion\s*=\s*''([0-9]+(?:\.[0-9]+){1,3})''').Groups[1].Value
          $notes = [regex]::Match($text, 'Version:\s*\r?\n\s*([0-9]+(?:\.[0-9]+){1,3})').Groups[1].Value

          if ([string]::IsNullOrWhiteSpace($constant))
          {
              Write-Host '::error::Could not find the $ScriptVersion constant. The update check depends on it.'
              exit 1
          }

          if ($constant -ne $notes)
          {
              Write-Host "::error::Version mismatch. The constant says $constant and the .NOTES block says $notes."
              exit 1
          }

          Write-Host "Version $constant is consistent."
