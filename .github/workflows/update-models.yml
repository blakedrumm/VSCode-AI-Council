name: Update Model Recommendations

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: council-model-recommendations
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      commit: ${{ steps.changes.outputs.commit }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install maintenance dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module powershell-yaml -Repository PSGallery -RequiredVersion 0.4.12 -Force -Scope CurrentUser
          Install-Module Pester -Repository PSGallery -RequiredVersion 6.0.1 -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Repository PSGallery -RequiredVersion 1.25.0 -Force -Scope CurrentUser -AllowClobber

      - name: Refresh and verify the public recommendation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./.github/scripts/Update-ModelRecommendation.ps1 -Source GitHubDocs -Update
          & ./.github/scripts/Update-ModelRecommendation.ps1 -Source GitHubDocs

      - name: Run static analysis and PowerShell 7 tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $findings = @(Invoke-ScriptAnalyzer -Path './Install-VSCodeCopilotCouncil-v5.ps1' -Settings './PSScriptAnalyzerSettings.psd1' -Severity Error, Warning)
          $findings += @(Invoke-ScriptAnalyzer -Path './.github/scripts' -Recurse -Settings './PSScriptAnalyzerSettings.psd1' -Severity Error, Warning)
          $findings += @(Invoke-ScriptAnalyzer -Path './tests' -Recurse -Settings './PSScriptAnalyzerSettings.psd1' -Severity Error, Warning)
          if ($findings.Count -gt 0) {
            $findings | Format-Table ScriptName, Line, RuleName, Message -AutoSize
            throw 'Static analysis failed; no recommendation will be published.'
          }
          Import-Module Pester -RequiredVersion 6.0.1 -Force
          Invoke-Pester -Path './tests' -CI -Output Detailed

      - name: Run Windows PowerShell 5.1 tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -Repository PSGallery -RequiredVersion 6.0.1 -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 6.0.1 -Force
          Invoke-Pester -Path './tests' -CI -Output Detailed

      - name: Check the publication scope
        id: changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @('Install-VSCodeCopilotCouncil-v5.ps1', 'README.md', '.github/model-recommendation-review.json')
          $changed = @(git diff --name-only)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the generated diff.' }
          foreach ($path in $changed) {
            if ($path -cnotin $allowed) { throw "Unexpected changed file: $path" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated diff has whitespace errors.' }
          $commit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "changed=$($changed.Count -gt 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          $review = Get-Content -LiteralPath '.github/model-recommendation-review.json' -Raw | ConvertFrom-Json
          "## Model recommendation check`n`nSource: $($review.sourceUrl)`n`nReviewed source commit: $($review.sourceCommit)`n`nRecommended: $($review.recommended -join ', ')`n`nChanged files: $($changed.Count)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload validated recommendation files
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-recommendation
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            Install-VSCodeCopilotCouncil-v5.ps1
            README.md
            .github/model-recommendation-review.json

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download validated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: model-recommendation
          path: candidate

      - name: Commit the validated files without executing them
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.refresh.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source commit.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $root = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $branch = [uri]::EscapeDataString($env:DEFAULT_BRANCH)
          $head = Invoke-RestMethod -Uri "$root/git/ref/heads/$branch" -Headers $headers -TimeoutSec 60
          if ($head.object.sha -cne $env:SOURCE_COMMIT) {
            throw 'The default branch advanced during validation. Rerun; nothing will be overwritten.'
          }
          $base = Invoke-RestMethod -Uri "$root/git/commits/$env:SOURCE_COMMIT" -Headers $headers -TimeoutSec 60
          $paths = @('Install-VSCodeCopilotCouncil-v5.ps1', 'README.md', '.github/model-recommendation-review.json')
          $files = @(Get-ChildItem -LiteralPath 'candidate' -File -Recurse -Force)
          if ($files.Count -ne $paths.Count) { throw 'Unexpected artifact contents.' }
          $treeEntries = @($paths | ForEach-Object {
            $path = Join-Path 'candidate' $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing candidate: $_" }
            @{ path = $_; mode = '100644'; type = 'blob'; content = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $path).Path) }
          })
          $treeBody = @{ base_tree = $base.tree.sha; tree = $treeEntries } | ConvertTo-Json -Depth 6 -Compress
          $tree = Invoke-RestMethod -Method Post -Uri "$root/git/trees" -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([System.Text.Encoding]::UTF8.GetBytes($treeBody)) -TimeoutSec 60
          $commitBody = @{ message = 'chore: refresh recommended Copilot models'; tree = $tree.sha; parents = @($env:SOURCE_COMMIT) } | ConvertTo-Json -Depth 4 -Compress
          $commit = Invoke-RestMethod -Method Post -Uri "$root/git/commits" -Headers $headers -ContentType 'application/json' -Body $commitBody -TimeoutSec 60
          $refBody = @{ sha = $commit.sha; force = $false } | ConvertTo-Json -Compress
          $null = Invoke-RestMethod -Method Patch -Uri "$root/git/refs/heads/$branch" -Headers $headers -ContentType 'application/json' -Body $refBody -TimeoutSec 60
          "Published validated model update: $($commit.html_url)" >> $env:GITHUB_STEP_SUMMARY